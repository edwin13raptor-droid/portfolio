<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Services — Edwin Dol</title>
  <meta name="description" content="Website design, development, landing pages and care plans by Edwin Dol." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-loading" data-page="services" data-title="Services">
  <header id="site-header"></header>

  <main id="top">
    <section class="page-hero">
      <p class="eyebrow" data-text="services.eyebrow"></p>
      <h1 data-rich="services.heading"></h1>
      <p class="lead" data-text="services.intro"></p>
    </section>

    <section class="section section-tight">
      <div class="service-rows" id="services-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h2 data-rich="services.packagesHeading"></h2>
          <p class="section-sub" data-text="services.packagesText"></p>
        </div>
        <div class="currency">
          <span>Currency</span>
          <select id="currency-picker" aria-label="Show prices in"></select>
        </div>
      </div>

      <div class="calc reveal" id="price-calc">
        <div class="calc-top">
          <p class="eyebrow">Price calculator</p>
          <p class="calc-hint"></p>
        </div>
        <p class="calc-price" aria-live="polite">—</p>

        <div class="calc-inputs">
          <div class="calc-input">
            <div class="calc-label">
              <label for="calc-main">Main pages</label>
              <span class="calc-count" data-out="main">1</span>
            </div>
            <p class="calc-sub">Custom designs — Home, About, Contact… Capped at <span data-unit="cap"></span> from <span data-unit="after"></span> pages.</p>
            <input id="calc-main" type="range" name="main" min="1" max="12" value="1" step="1" />
          </div>
          <div class="calc-input">
            <div class="calc-label">
              <label for="calc-inner">Inner pages</label>
              <input class="calc-number" type="number" name="innerCount" min="0" step="1" value="0" aria-label="Number of inner pages" inputmode="numeric" />
            </div>
            <p class="calc-sub">Template pages — blog posts, products, portfolio items. <span data-unit="inner"></span> each, never capped.</p>
            <input id="calc-inner" type="range" name="inner" min="0" max="50" value="0" step="1" />
          </div>
        </div>

        <ul class="calc-breakdown"></ul>

        <div class="calc-bottom">
          <p class="calc-sub">Final quote confirmed after your project brief.</p>
          <a href="start.html" class="btn btn-small">Get an exact quote <span class="arrow">→</span></a>
        </div>
      </div>

      <div class="packages" id="packages"></div>
      <p class="currency-note" id="currency-note"></p>
    </section>

    <section class="section">
      <div class="section-head"><h2 data-rich="services.processHeading"></h2></div>
      <ol class="process" id="process-list"></ol>
    </section>

    <section class="section faq-section">
      <div class="faq-side">
        <h2 data-rich="services.faqHeading"></h2>
        <p class="section-sub">Something else? <a href="contact.html" class="link">Ask me directly</a>.</p>
      </div>
      <div class="faq" id="faq"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="script.js"></script>
  <script src="content.js"></script>
  <script src="site.js"></script>
  <script src="motion.js"></script>
  <script src="showcase.js"></script>
</body>
</html>
