<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edwin Dol — Website Designer</title>
  <meta name="description" content="Edwin Dol is an independent website designer creating considered, high-end websites." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-loading" data-page="home">
  <header id="site-header"></header>

  <main id="top">
    <!-- Text is filled in from content.json / the admin panel by site.js -->
    <section class="hero">
      <p class="eyebrow" data-show="site.available"><span class="dot"></span> <span data-text="site.availableText"></span></p>
      <h1 data-rich="home.heading"></h1>
      <div class="hero-bottom">
        <p class="lead" data-text="home.lead"></p>
        <div class="hero-cta">
          <a href="start.html" class="btn"><span data-text="home.ctaPrimary"></span> <span class="arrow">→</span></a>
          <a href="work.html" class="btn btn-ghost" data-text="home.ctaSecondary"></a>
        </div>
      </div>
    </section>

    <section class="clients" aria-label="Clients">
      <div class="clients-inner">
        <p class="clients-label">Trusted by</p>
        <ul class="client-list" id="clients"></ul>
      </div>
    </section>

    <section class="section intro">
      <p class="eyebrow">Hello</p>
      <h2 class="statement reveal" data-rich="home.introHeading"></h2>
      <div class="intro-bottom reveal">
        <p data-text="home.introText"></p>
        <a href="about.html" class="link-arrow">More about me <span class="arrow">→</span></a>
      </div>
      <ul class="stats" id="stats"></ul>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h2 data-rich="home.featuredHeading"></h2>
          <p class="section-sub" data-text="home.featuredText"></p>
        </div>
        <a href="work.html" class="btn btn-ghost">All projects <span class="arrow">→</span></a>
      </div>
      <div class="featured" id="featured"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>What I <em>do</em></h2>
        <a href="services.html" class="btn btn-ghost">Services &amp; pricing <span class="arrow">→</span></a>
      </div>
      <div class="teasers" id="services-teaser"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 data-rich="home.testimonialsHeading"></h2>
      </div>
      <div class="quotes" id="testimonials"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="script.js"></script>
  <script src="site.js"></script>
  <script src="motion.js"></script>
</body>
</html>
