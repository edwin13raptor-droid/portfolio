<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edwin Dol — Website Designer</title>
  <meta name="description" content="Edwin Dol is an independent website designer creating considered, high-end websites." />
  <meta property="og:title" content="Edwin Dol — Website Designer" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-loading">
  <header class="nav">
    <a href="#top" class="logo" data-text="site.name">Edwin Dol</a>
    <nav>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
      <ul class="nav-links">
        <li><a href="#work">Work</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="start.html" class="btn btn-small">Start a project</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <!-- All text below is filled in from content.json (or what you saved in the admin panel) by site.js -->

    <!-- HERO -->
    <section class="hero">
      <p class="eyebrow" data-show="site.available"><span class="dot"></span> <span data-text="site.availableText"></span></p>
      <h1 data-rich="hero.heading"></h1>
      <p class="lead" data-text="hero.lead"></p>
      <div class="hero-cta">
        <a href="start.html" class="btn"><span data-text="hero.ctaPrimary"></span> <span class="arrow">→</span></a>
        <a href="#work" class="btn btn-ghost" data-text="hero.ctaSecondary"></a>
      </div>
      <ul class="stats" id="stats"></ul>
    </section>

    <!-- WORK -->
    <section id="work" class="section">
      <div class="section-head">
        <h2 data-rich="work.heading"></h2>
        <p class="eyebrow" data-text="work.eyebrow"></p>
      </div>
      <div class="projects" id="projects"></div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="section">
      <div class="section-head">
        <h2 data-rich="services.heading"></h2>
        <p class="eyebrow" data-text="services.eyebrow"></p>
      </div>
      <div class="services" id="services-list"></div>
    </section>

    <!-- PROCESS -->
    <section class="section">
      <div class="section-head">
        <h2 data-rich="process.heading"></h2>
        <p class="eyebrow" data-text="process.eyebrow"></p>
      </div>
      <ol class="process" id="process-list"></ol>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section about">
      <div class="about-photo reveal" id="about-photo"></div>
      <div class="about-text reveal">
        <p class="eyebrow" data-text="about.eyebrow"></p>
        <h2 data-rich="about.heading"></h2>
        <div class="about-body" data-paras="about.body"></div>
        <ul class="skills" id="skills"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section contact">
      <div class="contact-intro reveal">
        <p class="eyebrow" data-text="contact.eyebrow"></p>
        <h2 data-rich="contact.heading"></h2>
        <p data-text="contact.text"></p>
        <a href="start.html" class="link-arrow">Fill in the project form <span class="arrow">→</span></a>
        <ul class="contact-links" id="contact-links"></ul>
      </div>
      <form class="contact-form reveal" data-form="contact" novalidate>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" required maxlength="100" autocomplete="name" />
          <span class="error-msg">Please enter your name.</span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required maxlength="200" autocomplete="email" />
          <span class="error-msg">Please enter a valid email.</span>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required maxlength="5000"></textarea>
          <span class="error-msg">Please write a message.</span>
        </div>
        <input type="text" name="company_website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit" class="btn btn-full">Send message</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>© <span class="year"></span> <span data-text="site.name"></span></p>
    <a href="#top">Back to top ↑</a>
  </footer>

  <script src="script.js"></script>
  <script src="site.js"></script>
</body>
</html>
