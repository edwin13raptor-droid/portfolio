<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Edwin Dol</title>
  <meta name="description" content="Get in touch with Edwin Dol, website designer." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="is-loading" data-page="contact" data-title="Contact">
  <header id="site-header"></header>

  <main id="top">
    <section class="page-hero">
      <p class="eyebrow" data-text="contact.eyebrow"></p>
      <h1 data-rich="contact.heading"></h1>
      <p class="lead" data-text="contact.text"></p>
    </section>

    <section class="section section-tight contact">
      <div class="contact-side">
        <a href="start.html" class="brief-card reveal">
          <span class="eyebrow"><span class="dot"></span> Project brief</span>
          <h3 data-text="contact.briefHeading"></h3>
          <p data-text="contact.briefText"></p>
          <span class="btn">Start your project <span class="arrow">→</span></span>
        </a>
        <ul class="contact-links reveal" id="contact-links"></ul>
        <div class="contact-meta reveal">
          <p><span>Based in</span><span data-text="site.location"></span></p>
          <p><span>Response</span><span data-text="contact.response"></span></p>
        </div>
      </div>

      <form class="contact-form reveal" data-form="contact" novalidate>
        <h3 class="form-title">Send a message</h3>
        <div class="grid-2">
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" required maxlength="100" autocomplete="name" />
            <span class="error-msg">Please enter your name.</span>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required maxlength="200" autocomplete="email" />
            <span class="error-msg">Please enter a valid email.</span>
          </div>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required maxlength="5000"></textarea>
          <span class="error-msg">Please write a message.</span>
        </div>
        <input type="text" name="company_website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit" class="btn btn-full">Send message <span class="arrow">→</span></button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="script.js"></script>
  <script src="content.js"></script>
  <script src="site.js"></script>
  <script src="motion.js"></script>
  <script src="showcase.js"></script>
</body>
</html>
